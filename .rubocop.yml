AllCops:
  Exclude:
    - Gemfile
    - '**/Gemfile'
    - bin/**/*
    # These were written `config/**` and `db/**`, which match the directories
    # themselves but not the files inside them, so neither was actually
    # excluded — generated code (db/schema.rb alone accounts for ~206) and
    # Rails boilerplate made `bundle exec rubocop` fail on every commit,
    # including main. `/**/*` is the form that matches the contents.
    - config/**/*
    - db/**/*
    # One-off analysis scripts, kept for reference rather than maintained.
    - scripts/**/*
    # Editor tooling, gitignored. CI never checks it out, so excluding it keeps
    # a local `bundle exec rubocop` honest about what CI will say.
    - .ruby-lsp/**/*
    # https://github.com/rubocop/rubocop/issues/9832
    - vendor/bundle/**/*
  TargetRubyVersion:
    '2.7.2'
  NewCops: enable

Bundler/OrderedGems:
  Enabled: false

Layout/LineLength:
  Max: 120
  Exclude:
    - config/**/*
    - db/**/*

Metrics/AbcSize:
  Max: 25
  Exclude:
    - app/controllers/**/*
    - app/services/**/*
    - spec/**/*
    - lib/**/*
Metrics/BlockLength:
  Exclude:
    - config/**/*
    - db/**/*
    - spec/**/*
Metrics/ClassLength:
  Max: 350
  Exclude:
    - app/controllers/**/*
    # ~320 of its lines are the static DEFAULT_PAYMENT_SCHEDULES table, not
    # logic. That data wants to move to config/ eventually (cap_ruby-b3a.22);
    # until then the length metric says nothing useful about this file.
    - app/services/payment_schedule_service.rb
Metrics/CyclomaticComplexity:
  Max: 12
Metrics/MethodLength:
  Max: 40
  Exclude:
    - app/controllers/**/*
    - config/**/*
    - db/**/*
Metrics/ModuleLength:
  Enabled: false
Metrics/ParameterLists:
  Max: 6
  CountKeywordArgs: false
Metrics/PerceivedComplexity:
  Max: 12

Naming/VariableNumber:
  Exclude:
    - spec/**/*

Style/ConditionalAssignment:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/FormatString:
  Enabled: false
Style/MixinUsage:
  Enabled: false
Style/NumericLiterals:
  Enabled: false

