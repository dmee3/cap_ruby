env:
  browser: true
  es2021: true
  jquery: true
extends:
  - 'eslint:recommended'
  - prettier
parserOptions:
  ecmaVersion: 12
  sourceType: module
rules: {}
overrides:
  - files: ['*.ts', '*.tsx']
    parser: '@typescript-eslint/parser'
    parserOptions:
      ecmaFeatures:
        jsx: true
    plugins:
      - '@typescript-eslint'
    extends:
      - 'eslint:recommended'
      - 'plugin:@typescript-eslint/recommended'
      - 'plugin:react-hooks/recommended'
      - prettier
  - files: ['*.test.ts', '*.test.tsx']
    rules:
      '@typescript-eslint/no-empty-function': off
